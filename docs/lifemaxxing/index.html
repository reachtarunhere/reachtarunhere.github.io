<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Lifemaxxing</title>
  <style>
    :root { --cream: #f6f2e9; --paper: #fffcf6; --ink: #293a32; --muted: #596359; --sage: #e7ecdf; --line: #c9d1c1; --clay: #914832; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    main { width: min(100% - 48px, 720px); margin: 52px auto 32px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--clay); font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 650; }
    .seed { width: 12px; height: 20px; border-radius: 100% 0 100% 0; background: var(--clay); transform: rotate(-20deg); }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.035em; line-height: 1.2; text-wrap: pretty; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); max-width: 590px; margin: 18px 0 14px; }
    .intro { max-width: 550px; color: var(--muted); margin: 0 0 30px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 30px; box-shadow: 0 8px 32px #293a3205; }
    .postcard { margin: 0 0 24px; }
    .scene { aspect-ratio: 16 / 9; background: var(--sage); border-radius: 16px; overflow: hidden; }
    #scene-image { display: block; width: 100%; height: 100%; object-fit: cover; }
    #scene-image[hidden] { display: none; }
    #scene-caption { margin-top: 9px; color: var(--muted); font: italic .85rem/1.5 Georgia, "Times New Roman", serif; }
    footer a { display: inline-block; color: var(--clay); padding: 12px; text-underline-offset: 3px; }
    #step-label { color: var(--clay); font-size: .75rem; text-transform: uppercase; letter-spacing: .13em; margin: 0 0 12px; font-weight: 650; }
    h2 { font-size: clamp(1.65rem, 4vw, 2.1rem); margin: 0 0 14px; }
    #description { color: var(--muted); margin: 0 0 24px; white-space: pre-line; }
    #choices { display: grid; gap: 10px; }
    button { font: inherit; color: inherit; cursor: pointer; min-height: 48px; touch-action: manipulation; }
    .choice { width: 100%; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 13px; padding: 14px 18px; transition: background-color .15s, border-color .15s; overflow-wrap: anywhere; }
    .choice:hover { background: var(--sage); border-color: #8b9d87; }
    .choice:active { background: #dbe4d2; }
    .choice-title { display: block; font-weight: 600; line-height: 1.4; }
    .choice-detail { display: block; color: var(--muted); font-size: .9rem; line-height: 1.5; margin-top: 5px; }
    nav { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 24px; }
    .quiet { background: transparent; border: 0; border-radius: 8px; padding: 10px 12px; color: var(--clay); }
    .quiet:hover:not(:disabled) { background: #f1e7db; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 3px solid var(--clay); outline-offset: 4px; }
    h2:focus { outline: 2px solid var(--clay); outline-offset: 6px; border-radius: 2px; }
    footer { padding: 22px 6px 0; color: var(--muted); font-size: .8rem; text-align: center; }
    noscript p { padding: 16px; border: 1px solid var(--clay); border-radius: 12px; }
    @media (max-width: 480px) {
      main { width: calc(100% - 28px); margin-top: 28px; }
      .card { padding: 22px 18px; border-radius: 19px; }
      .intro { margin-bottom: 24px; }
      .choice { padding: 13px 14px; }
      .scene { aspect-ratio: 5 / 2; border-radius: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow"><span class="seed" aria-hidden="true"></span> A little room for living</div>
      <h1>Lifemaxxing</h1>
      <p class="intro">What might feel good from here? One small choice is enough.</p>
    </header>
    <section class="card" aria-labelledby="step-title">
      <figure class="postcard">
        <div class="scene">
          <img id="scene-image" src="lifemaxxing-photos/green-path.jpg" alt="A quiet walking path between leafy green trees." width="1200" height="675" loading="eager" decoding="async">
        </div>
        <figcaption id="scene-caption">A little air. No destination needed.</figcaption>
      </figure>
      <p id="step-label">Check in</p>
      <h2 id="step-title" tabindex="-1" aria-describedby="description">How does being you feel right now?</h2>
      <p id="description">Choose what feels closest. It does not need to be exact.</p>
      <noscript><p>This little guide needs JavaScript enabled, but never needs the internet. For now, perhaps some tea on the balcony, a short walk, or quiet company?</p></noscript>
      <div id="choices"></div>
      <nav aria-label="Check-in navigation">
        <button type="button" class="quiet" id="back" disabled>← Back</button>
        <button type="button" class="quiet" id="reset">Start again</button>
      </nav>
    </section>
    <footer>Only here, only now. Nothing is saved or tracked.<br><a href="lifemaxxing-photos/CREDITS.md">Photo credits</a></footer>
  </main>

      { src: 'lifemaxxing-photos/forest-friends.jpg', alt: 'A group of friends hiking together through leafy forest.', caption: photos.hills[0].caption },
      { src: 'lifemaxxing-photos/woodland-hikers.jpg', alt: 'Friends walking through the woods with trekking poles.', caption: photos.hills[1].caption },
      { src: 'lifemaxxing-photos/picnic-laughter.jpg', alt: 'Women friends laughing together at an outdoor picnic.', caption: photos.picnic[0].caption },
      { src: 'lifemaxxing-photos/blanket-conversation.jpg', alt: 'Women friends relaxing and talking on a picnic blanket.', caption: photos.picnic[1].caption },
      { src: 'lifemaxxing-photos/seaside-pizza.jpg', alt: 'Friends sharing pizza on a picnic blanket beside the ocean.', caption: photos.picnic[2].caption },
      { src: 'lifemaxxing-photos/couple-under-trees.jpg', alt: 'A couple smiling at each other beneath a leafy park tree.', caption: photos.path[0].caption },
      { src: 'lifemaxxing-photos/couple-park-stroll.jpg', alt: 'A couple strolling together through a green park.', caption: photos.path[2].caption },
      { src: 'lifemaxxing-photos/sofa-laughter.jpg', alt: 'Two women laughing together while relaxing on a sofa.', caption: photos.sofa[0].caption },
      { src: 'lifemaxxing-photos/friends-preparing-food.jpg', alt: 'Women friends preparing food together in a home kitchen.', caption: photos.food[0].caption },
      { src: 'lifemaxxing-photos/kitchen-laughter.jpg', alt: 'Two women laughing together beside a kitchen blender.', caption: photos.food[1].caption },
      { src: 'lifemaxxing-photos/couple-cooking.jpg', alt: 'A couple sharing a happy moment while cooking together.', caption: photos.food[0].caption }
    ];
    photos.path.push(photos.company[0], photos.company[6], photos.company[7]);
    photos.hills.push(photos.company[0], photos.company[1], photos.company[2]);
    photos.picnic.push(photos.company[3], photos.company[4], photos.company[5]);
    photos.food.push(photos.company[5], photos.company[9], photos.company[10], photos.company[11]);
    photos.home = [...photos.path.slice(0, 3), photos.company[0], photos.company[3], photos.company[8]];
    const feelingPhotos = { possibilities: 'tea', physical: 'tea', weighed: 'table', flat: 'plants', lonely: 'company', full: 'book', good: 'hills', unsure: 'tea', carry: 'path' };
    const cuePhotos = { wife: 'company', share: 'company', friends: 'company', possibilitycompany: 'company', depleted: 'tea', sluggish: 'path', stiff: 'sofa', tired: 'sofa', routine: 'path', interesting: 'book', story: 'picnic', small: 'plants', future: 'hills', screens: 'tea', world: 'book', quietcompany: 'sofa', warmth: 'sofa', body: 'hills', special: 'picnic' };
    const activityPhotos = {
      water: 'tea', balcony: 'tea', tea: 'tea', unsuretea: 'tea',
      walk: 'path', walkwife: 'company', unsurewalk: 'path', scene: 'city', event: 'city', meetup: 'company', family: 'company', friend: 'company', invite: 'company', photo: 'sky', temple: 'temple',
      novel: 'book', taleb: 'book', learn: 'book', unsurebook: 'book',
      picnic: 'picnic', plants: 'plants', hike: 'hills', hikeplan: 'hills',
      rest: 'sofa', nap: 'sofa', watchwife: 'company', chatwife: 'company', film: 'sofa', comedy: 'sofa', wholesome: 'sofa', unsurecompany: 'company',
      firststep: 'table', helper: 'table', park: 'table', plan: 'table', sessionplan: 'table', dump: 'table', tidy: 'table', work: 'table', yoghurt: 'food', meal: 'food', cook: 'food'
    };
    const possibilitiesInvitation = { id: 'possibilities', label: 'Nothing quite fits? Bring some possibilities to mind' };
    let path = [];
    let sceneKey;
    let sceneImage;
    const checkIn = {
      view() {
        // Keep the entry path before this marker so Back returns to that exact step.
        const possibilitiesIndex = path.indexOf('possibilities');
        const [feeling, cue, activity, touch] = possibilitiesIndex < 0 ? path : path.slice(possibilitiesIndex);
        const invitation = feeling === 'possibilities' ? undefined : possibilitiesInvitation;
        const key = path.join('/');
        if (sceneKey !== key) {
          const pool = photos[activityPhotos[feeling === 'unsure' ? cue : activity] || cuePhotos[cue] || feelingPhotos[feeling] || (feeling ? 'path' : 'home')];
          const candidates = pool.filter(photo => photo.src !== sceneImage?.src);
          sceneImage = candidates[Math.floor(Math.random() * candidates.length)];
          sceneKey = key;
        }
        const image = sceneImage;
        if (!feeling) return { image, invitation, stage: 'feeling', title: 'How does being you feel right now?', description: 'Choose what feels closest. It does not need to be exact.', choices: feelings };
        if (feeling === 'carry') return { image, stage: 'done', title: 'For now, keep enjoying this.', description: 'You can carry on just as you are. Nothing needs improving, and you do not have to choose something new.', choices: [] };
        if (feeling === 'possibilities' && !cue) return { image, stage: 'cue', title: 'Bring some possibilities to mind', description: 'You do not need to feel a particular way to try these. See if one sounds inviting.', choices: cues.possibilities };
        if (feeling !== 'unsure' && !cue) return { image, invitation, stage: 'cue', title: 'What is the little cue underneath?', description: 'Pick the thought that sounds familiar, not the one you think you ought to pick.', choices: cues[feeling] };
        const selectedCue = feeling === 'unsure' ? null : cues[feeling].find(c => c.id === cue);
        const activityId = feeling === 'unsure' ? cue : activity;
        const touchId = feeling === 'unsure' ? activity : touch;
        const selected = activities[activityId];
        if (!selected) {
          const ids = selectedCue ? selectedCue.activities : ['unsuretea', 'unsurebook', 'unsurewalk', 'unsurecompany'];
          return { image, invitation, stage: 'activity', title: selectedCue ? selectedCue.prompt : 'Does one of these scenes sound inviting?', description: feeling === 'unsure' ? 'No need for a perfect match. A small try can help you discover your appetite.' : feeling === 'physical' ? 'These are everyday options, not cures or prescriptions. Choose only what feels comfortable; rest is allowed too.' : selectedCue.id === 'future' ? 'This is about future joy, not company now. If you want someone beside you today, go back and choose a call or invitation.' : 'What sounds welcome? A small version counts. You can always go back and try another direction.', choices: ids.map(id => ({ id, label: activities[id][0], detail: activities[id][1] })) };
        }
        const examples = touches[selected[2]];
        const chore = selected[2] === 'chore';
        const park = selected[2] === 'park';
        const labels = chore
          ? ['Make it smaller', 'Do it alongside someone', 'Pair it with something nice', 'Just get it done']
          : park ? ['Write it down', 'Tell someone', 'A small goodbye', 'Just let it go']
          : ['Somewhere lovely', 'With someone', 'A small ritual', 'Just as it is'];
        const options = [
          { id: 'place', label: labels[0], detail: examples[0] },
          { id: 'company', label: labels[1], detail: examples[1] },
          { id: 'ritual', label: labels[2], detail: examples[2] },
          { id: 'plain', label: labels[3], detail: chore ? 'No extra setup. Do it and be done.' : park ? 'Nothing else needed. Deciding is enough.' : 'No extra preparation. This is already enough.' }
        ];
        if (!touchId) return { image, stage: 'touch', title: chore ? 'What would make this less painful?' : park ? 'How could I set it down for now?' : 'Would I enjoy this more somewhere else, with someone, or with a small ritual?', description: 'You’ve chosen: ' + selected[0] + '.\nOnly add a touch if it makes this nicer, not harder.', choices: options };
        const extra = (touchId === 'plain' ? '' : options.find(c => c.id === touchId).detail + '\n\n')
          + (activityId === 'park' ? 'This time is allowed to be yours. The task will still be there later.\n\n' : '');
        return { image, stage: 'done', title: 'For now, ' + selected[0][0].toLowerCase() + selected[0].slice(1) + '.', description: extra + 'You can try it for a few minutes. You do not need to fill two hours.\n\nYou can put this page down and begin, or change your mind. Either is fine.', choices: [] };
      },
      choose(id) {
        const view = this.view();
        if (id !== view.invitation?.id && !view.choices.some(choice => choice.id === id)) return;
        path.push(id);
        this.render();
      },
      back() { path.pop(); this.render(); },
      reset() { path = []; sceneKey = undefined; this.render(); },
      render() {
        const view = this.view();
        const image = document.getElementById('scene-image');
        image.alt = view.image.alt;
        // A failed image stays hidden until a different scene is requested.
        if (image.getAttribute('src') !== view.image.src) {
          image.hidden = false;
          image.src = view.image.src;
        }
        document.getElementById('scene-caption').textContent = view.image.caption;
        document.getElementById('step-label').textContent = { feeling: 'Check in', cue: 'A little closer', activity: 'Something to try', touch: 'An optional touch', done: 'Enough for now' }[view.stage];
        const title = document.getElementById('step-title');
        title.textContent = view.title;
        document.getElementById('description').textContent = view.description;
        const choices = document.getElementById('choices');
        choices.replaceChildren();
        for (const choice of [...view.choices, ...(view.invitation ? [view.invitation] : [])]) {
          const button = document.createElement('button');
          button.type = 'button'; button.className = choice === view.invitation ? 'quiet' : 'choice';
          const label = document.createElement('span');
          label.className = 'choice-title'; label.textContent = choice.label;
          button.append(label);
          if (choice.detail) {
            const detail = document.createElement('span');
            detail.className = 'choice-detail'; detail.textContent = choice.detail;
            button.append(detail);
          }
          button.addEventListener('click', () => this.choose(choice.id));
          choices.append(button);
        }
        document.getElementById('back').disabled = path.length === 0;
        title.focus();
      }
    };
    document.getElementById('back').addEventListener('click', () => checkIn.back());
    document.getElementById('reset').addEventListener('click', () => checkIn.reset());
    document.getElementById('scene-image').addEventListener('error', () => { document.getElementById('scene-image').hidden = true; });
    checkIn.render();
  </script>
</body>
</html>
